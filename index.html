<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch Puchy 🐾</title>
<style>
/* ============================================================
   EASY CUSTOMIZATION — change these to make it yours
   ============================================================ */
:root{
  --hero-name: "JiNN";              /* the panda (you) */
  --crush-name: "Puchy";            /* the cat (her) */
}
/* ------------------------------------------------------------
   🎵 The song is already wired up: "Until I Found You" by
   Stephen Sanchez, streamed from your Spotify link. Want a
   different version? Swap SPOTIFY_TRACK_ID near the bottom of
   the <script> for another track's ID (the part of its Spotify
   link after /track/).
   ------------------------------------------------------------ */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap');

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0; height:100%; overflow:hidden;
  font-family:'Quicksand',sans-serif;
  background:radial-gradient(circle at 30% 20%, #ffe3ec 0%, #ffd2e0 40%, #ffc2d6 100%);
}

h1,h2,.title-font{ font-family:'Baloo 2', cursive; }

/* ---------- floating hearts ambience ---------- */
.hearts-bg{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.hearts-bg span{
  position:absolute; bottom:-10%; font-size:22px; opacity:.55;
  animation:float-up linear infinite;
  color:#ff8fb3;
}
@keyframes float-up{
  0%{ transform:translateY(0) rotate(0deg); opacity:0;}
  10%{opacity:.6;}
  100%{ transform:translateY(-110vh) rotate(25deg); opacity:0;}
}

/* ---------- screens ---------- */
.screen{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; text-align:center; z-index:2;
  transition:opacity .5s ease;
}
.hidden{ display:none !important; }

/* ---------- screen 1 : invite card ---------- */
#screen-start .card{
  background:#fff8fa; border-radius:32px; padding:44px 36px;
  box-shadow:0 18px 40px rgba(255,105,150,.28);
  max-width:420px; width:88%;
  border:3px dashed #ffb6cf;
  animation:pop-in .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop-in{ 0%{transform:scale(.7); opacity:0;} 100%{transform:scale(1); opacity:1;} }
.paw{ font-size:44px; display:block; margin-bottom:6px; }
#screen-start h1{
  font-size:1.9rem; color:#e04b7a; margin:0 0 8px; line-height:1.3;
}
#screen-start p{ color:#a15070; margin:0 0 26px; font-weight:600; font-size:1.02rem; }
.choice-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.yes-btn{
  font-family:'Baloo 2',cursive; font-size:1.15rem; border:none; cursor:pointer;
  padding:14px 30px; border-radius:999px; color:#fff; font-weight:700;
  box-shadow:0 8px 0 rgba(0,0,0,.08), 0 10px 20px rgba(255,90,140,.35);
  transition:transform .15s ease;
}
.yes-btn:active{ transform:translateY(4px); box-shadow:0 4px 0 rgba(0,0,0,.08); }
.yes-btn.a{ background:linear-gradient(135deg,#ff6f9c,#ff4d88); }
.yes-btn.b{ background:linear-gradient(135deg,#ff9ac2,#ff6fa8); }

/* ---------- screen 2 : the chase ---------- */
#screen-game{ cursor:none; touch-action:none; }
#game-banner{
  position:absolute; top:22px; left:0; right:0; text-align:center; pointer-events:none;
  color:#c23768; font-family:'Baloo 2',cursive; font-size:1.15rem;
  text-shadow:0 2px 0 #fff; z-index:5;
}
#cat-cursor, #panda{
  position:absolute; top:0; left:0; font-size:52px; line-height:1;
  user-select:none; will-change:transform; pointer-events:none; z-index:4;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));
}
#cat-cursor{ font-size:44px; }
.run-bounce{ animation:run-bounce .28s ease-in-out infinite; }
@keyframes run-bounce{
  0%,100%{ transform: translate(var(--px),var(--py)) scaleX(var(--fx)) translateY(0) rotate(0deg); }
  50%{ transform: translate(var(--px),var(--py)) scaleX(var(--fx)) translateY(-10px) rotate(-6deg); }
}

/* ---------- screen 3 : caught overlay ---------- */
#screen-caught{
  background:radial-gradient(circle at 50% 40%, #ff9fc0 0%, #ff5f9c 60%, #e83b85 100%);
  z-index:10;
}
#screen-caught .burst{
  font-size:3.6rem; margin-bottom:6px;
  animation:bounce-in .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes bounce-in{ 0%{transform:scale(0) rotate(-20deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;} }
#screen-caught h2{
  color:#fff; font-size:2.1rem; margin:0 0 10px; text-shadow:0 3px 0 rgba(0,0,0,.12);
}
#screen-caught p{
  color:#fff0f5; font-weight:700; font-size:1.15rem; max-width:380px; margin:0 auto 30px;
}
.again-btn{
  font-family:'Baloo 2',cursive; font-size:1.05rem; border:none; cursor:pointer;
  padding:13px 28px; border-radius:999px; background:#fff; color:#e04b7a; font-weight:800;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}

/* ---------- our photo (polaroid) ---------- */
.polaroid{
  background:#fff; padding:12px 12px 42px; border-radius:10px;
  box-shadow:0 16px 30px rgba(0,0,0,.25);
  transform:rotate(-4deg);
  margin:0 auto 22px; max-width:230px;
  animation:polaroid-drop .7s cubic-bezier(.34,1.56,.64,1) .15s both;
}
@keyframes polaroid-drop{
  0%{ transform:translateY(-40px) rotate(-4deg); opacity:0; }
  100%{ transform:translateY(0) rotate(-4deg); opacity:1; }
}
.polaroid img{ display:block; width:100%; border-radius:2px; }
.polaroid span{
  display:block; text-align:center; margin-top:10px;
  font-family:'Baloo 2',cursive; color:#c23768; font-size:.95rem;
}

/* ---------- music button + visible player ---------- */
.music-btn{
  margin-top:20px; background:none; border:2px solid #ff8fb3; color:#e04b7a;
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.95rem;
  padding:9px 20px; border-radius:999px; cursor:pointer; transition:.2s;
}
.music-btn.playing{ background:#ff6f9c; color:#fff; border-color:#ff6f9c; }
.music-hint{
  font-size:.78rem; color:#c2799a; margin:6px 0 0; font-weight:600;
}
#songWrap{
  max-height:0; overflow:hidden; width:100%; margin-top:0;
  transition:max-height .35s ease, margin-top .35s ease;
}
#songWrap.open{ max-height:90px; margin-top:14px; }
#songFrame{
  width:100%; height:80px; border:0; border-radius:14px;
  box-shadow:0 6px 16px rgba(255,90,140,.25);
}
.confetti-heart{
  position:absolute; top:-10%; font-size:20px; animation:fall linear forwards; pointer-events:none;
}
@keyframes fall{ to{ transform:translateY(120vh) rotate(360deg); opacity:.2; } }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<!-- ===================== SCREEN 1 ===================== -->
<div class="screen" id="screen-start">
  <div class="card">
    <span class="paw">🐼🐾🐱</span>
    <h1>Are you ready for the game, Puchy?</h1>
    <p>One tiny game... two ways to say yes 🩷</p>
    <div class="choice-row">
      <button class="yes-btn a" onclick="startGame()">Yes 💕</button>
      <button class="yes-btn b" onclick="startGame()">Yesss! 🥰</button>
    </div>
    <button class="music-btn" id="musicBtn" onclick="toggleSong()">🎵 play "Until I Found You"</button>
    <p class="music-hint" id="musicHint" style="display:none;">tap ▶ on the player below 👇</p>
    <div id="songWrap">
      <iframe id="songFrame" src="" allow="autoplay; encrypted-media; clipboard-write; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </div>
</div>

<!-- ===================== SCREEN 2 ===================== -->
<div class="screen hidden" id="screen-game">
  <div id="game-banner">run, Puchy, run.. 🐾</div>
  <div id="panda" class="run-bounce">🐼</div>
  <div id="cat-cursor">🐱</div>
</div>

<!-- ===================== SCREEN 3 ===================== -->
<div class="screen hidden" id="screen-caught">
  <div class="burst">🐼💥🐱</div>
  <h2 id="caughtTitle">caught you 💗</h2>
  <div class="polaroid">
    <img id="usPhoto" src="" alt="us">
    <span>us 🐼🐱</span>
  </div>
  <p id="caughtSub">now it's time to eat you up... 😋💋</p>
  <button class="again-btn" onclick="restartGame()">Run away again? 🏃‍♀️💨</button>
</div>

<script>
/* names */
const heroName = getComputedStyle(document.documentElement).getPropertyValue('--hero-name').trim().replace(/"/g,'');
const crushName = getComputedStyle(document.documentElement).getPropertyValue('--crush-name').trim().replace(/"/g,'');
document.getElementById('caughtTitle').textContent = heroName + ' caught you 💗';

/* "Until I Found You" — Stephen Sanchez (your Spotify track) */
const SPOTIFY_TRACK_ID = "0T5iIrXA4p5GsubkhuBIKV";
let songOpen = false;
function toggleSong(){
  const wrap = document.getElementById('songWrap');
  const frame = document.getElementById('songFrame');
  const btn = document.getElementById('musicBtn');
  const hint = document.getElementById('musicHint');
  if(!songOpen){
    frame.src = `https://open.spotify.com/embed/track/${SPOTIFY_TRACK_ID}?autoplay=1`;
    wrap.classList.add('open');
    hint.style.display = 'block';
    btn.textContent = '✕ hide the song';
    btn.classList.add('playing');
  } else {
    wrap.classList.remove('open');
    frame.src = "";
    hint.style.display = 'none';
    btn.textContent = '🎵 play "Until I Found You"';
    btn.classList.remove('playing');
  }
  songOpen = !songOpen;
}

/* floating hearts background */
const heartsBg = document.getElementById('heartsBg');
for(let i=0;i<16;i++){
  const s = document.createElement('span');
  s.textContent = ['💗','💕','🐾','💞'][Math.floor(Math.random()*4)];
  s.style.left = Math.random()*100+'%';
  s.style.fontSize = (14+Math.random()*20)+'px';
  s.style.animationDuration = (7+Math.random()*8)+'s';
  s.style.animationDelay = (Math.random()*8)+'s';
  heartsBg.appendChild(s);
}

const screenStart = document.getElementById('screen-start');
const screenGame  = document.getElementById('screen-game');
const screenCaught= document.getElementById('screen-caught');
const cat = document.getElementById('cat-cursor');
const panda = document.getElementById('panda');
const banner = document.getElementById('game-banner');

let catX = innerWidth/2, catY = innerHeight/2;
let pandaX = 60, pandaY = 60;
let facing = 1;
let running = false;
let startTime = 0;
let rafId = null;

function startGame(){
  screenStart.classList.add('hidden');
  screenGame.classList.remove('hidden');
  catX = innerWidth/2; catY = innerHeight/2;
  pandaX = 60; pandaY = 60;
  running = true;
  startTime = performance.now();
  banner.textContent = "run, "+crushName+", run.. 🐾";
  rafId = requestAnimationFrame(loop);
}

function restartGame(){
  screenCaught.classList.add('hidden');
  document.querySelectorAll('.confetti-heart').forEach(e=>e.remove());
  startGame();
}

function setCatPos(x,y){
  catX = x; catY = y;
  cat.style.transform = `translate(${x-22}px, ${y-22}px)`;
}

document.addEventListener('mousemove', e=>{ if(running) setCatPos(e.clientX, e.clientY); });
document.addEventListener('touchmove', e=>{
  if(running && e.touches[0]){ setCatPos(e.touches[0].clientX, e.touches[0].clientY); }
}, {passive:true});

function loop(t){
  if(!running) return;
  const elapsed = (t - startTime)/1000;
  const speed = Math.min(2.2 + elapsed*0.35, 7.5); // gets faster over time — you WILL catch her eventually

  const dx = catX - pandaX, dy = catY - pandaY;
  const dist = Math.hypot(dx,dy) || 1;
  const wobble = Math.sin(t/180) * 1.4;

  pandaX += (dx/dist)*speed + wobble;
  pandaY += (dy/dist)*speed;
  facing = dx < 0 ? -1 : 1;

  panda.style.setProperty('--px', (pandaX-30)+'px');
  panda.style.setProperty('--py', (pandaY-30)+'px');
  panda.style.setProperty('--fx', facing);
  panda.style.transform = `translate(${pandaX-30}px, ${pandaY-30}px) scaleX(${facing})`;

  if(elapsed > 6 && dist < 46){
    running = false;
    caughtHer();
    return;
  }
  rafId = requestAnimationFrame(loop);
}

function caughtHer(){
  screenGame.classList.add('hidden');
  screenCaught.classList.remove('hidden');
  for(let i=0;i<24;i++){
    const h = document.createElement('span');
    h.className = 'confetti-heart';
    h.textContent = ['💖','💗','💕','🐾'][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*100+'%';
    h.style.animationDuration = (2+Math.random()*2)+'s';
    h.style.animationDelay = (Math.random()*1.2)+'s';
    screenCaught.appendChild(h);
  }
}

window.addEventListener('resize', ()=>{
  catX = Math.min(catX, innerWidth); catY = Math.min(catY, innerHeight);
});
</script>
